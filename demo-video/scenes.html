<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root{--page:#f4efe8;--ink:#241d18;--muted:#7d6f64;--line:#e2d8cc;--panel:#fffdfa;--screen:#14110f;--sink:#f6eee6;--smuted:#a8998b;--ember:#e46a2e;--glow:#3fd0ff;--sage:#5c9a78}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink)}
#stage.dark{background:radial-gradient(1200px 800px at 50% 60%,#2a1d15 0%,var(--screen) 60%);color:var(--sink)}
#stage.cream{background:var(--page)}
.abs{position:absolute}
.serif{font-family:Fraunces,serif}
.mono{font-family:"JetBrains Mono",monospace}
.center{left:0;right:0;text-align:center}
.kicker{font:600 22px/1 Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--ember)}
.chip{display:inline-block;padding:14px 26px;border-radius:999px;border:1.5px solid currentColor;font:500 26px/1 "JetBrains Mono";margin:0 10px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(36,29,24,.12);padding:26px 30px}
.bubble{border-radius:26px;padding:20px 26px;font:500 28px/1.3 Inter;max-width:520px}
.node{width:300px;padding:26px;border-radius:24px;text-align:center;font:600 28px/1.25 Inter}
.node small{display:block;font:400 21px/1.3 Inter;opacity:.7;margin-top:8px}
.term{background:#0e0c0b;border-radius:20px;border:1px solid #3a302a;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.term .bar{height:46px;background:#1c1714;display:flex;align-items:center;gap:10px;padding:0 18px}
.term .bar i{width:14px;height:14px;border-radius:50%;background:#4a3e36;display:block}
.term pre{font:400 22px/1.55 "JetBrains Mono";color:#e9dfd6;padding:24px 30px;white-space:pre}
.ok{color:#7fd19b}.lvl{color:#a8998b}
</style></head>
<body><div id="stage"></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
const SCENE = q.get("s"), D = Number(q.get("d") || 6);
const stage = document.getElementById("stage");
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const add = (html, parent = stage) => parent.appendChild(el(html));
const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

const ringSVG = (size, stroke = 10) => `<svg class="abs" width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(246,238,230,.08)" stroke-width="${stroke / 10 * 2}"/>
  <circle class="arc" cx="50" cy="50" r="44" fill="none" stroke="url(#g${size})" stroke-width="${stroke / 10 * 2}" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 50 50)"/>
  <defs><linearGradient id="g${size}" x1="0" x2="1"><stop offset="0" stop-color="#3fd0ff"/><stop offset="1" stop-color="#e46a2e"/></linearGradient></defs></svg>`;

const scenes = {
  title() {
    stage.className = "dark";
    const glow = add(`<div class="abs" style="left:660px;top:240px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(228,106,46,.55),rgba(228,106,46,0) 65%);filter:blur(10px)"></div>`);
    const ring = add(`<div class="abs" style="left:760px;top:250px;width:400px;height:400px">${ringSVG(400, 14)}</div>`);
    const dot = add(`<div class="abs" style="left:935px;top:425px;width:50px;height:50px;border-radius:50%;background:var(--ember);box-shadow:0 0 60px 20px rgba(228,106,46,.6)"></div>`);
    const word = add(`<div class="abs center serif" style="top:690px;font-size:150px;font-weight:600;letter-spacing:-.02em">${[..."Hearth"].map((c) => `<span style="display:inline-block">${c}</span>`).join("")}</div>`);
    const sub = add(`<div class="abs center" style="top:880px;font:500 36px Inter;color:var(--smuted)">An Alexa+ caregiving co-pilot</div>`);
    const mono = add(`<div class="abs center mono" style="top:950px;font-size:22px;color:#8b7d71;letter-spacing:.04em">self-hosted MCP server · spec 2025-11-25 · Streamable HTTP</div>`);
    tl.from(glow, { scale: .3, opacity: 0, duration: 1.6 }, 0)
      .from(dot, { scale: 0, duration: .8, ease: "back.out(2)" }, .2)
      .to(ring.querySelector(".arc"), { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut" }, .3)
      .from(word.children, { y: 80, opacity: 0, stagger: .06, duration: .9 }, .7)
      .from(sub, { y: 20, opacity: 0, duration: .8 }, 1.4)
      .from(mono, { opacity: 0, duration: .8 }, 1.9)
      .to(glow, { scale: 1.12, opacity: .8, duration: 1.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.6);
  },

  problem() {
    stage.className = "cream";
    const stat = add(`<div class="abs serif" style="left:140px;top:300px;font-size:250px;font-weight:600;line-height:.9;color:var(--ember)">1<span style="font-size:120px;color:var(--ink)"> in </span>5</div>`);
    const line = add(`<div class="abs" style="left:150px;top:560px;width:720px;font:500 46px/1.25 Inter">US adults is an unpaid family caregiver.</div>`);
    const line2 = add(`<div class="abs" style="left:150px;top:700px;width:700px;font:400 32px/1.4 Inter;color:var(--muted)">Many coordinate care from far away, and the information lives everywhere.</div>`);
    const frags = [
      add(`<div class="abs card" style="left:1080px;top:120px;width:380px;background:#fff3b8;border-color:#ecd98a;transform:rotate(-4deg);font:500 30px/1.3 Inter">Did Mom take her 8pm pill??</div>`),
      add(`<div class="abs bubble" style="left:1500px;top:200px;background:#dfe9ff;color:#1f2a44">Priya: who's driving Mom on Friday?</div>`),
      add(`<div class="abs card" style="left:1180px;top:420px;width:470px"><div class="kicker" style="font-size:16px;margin-bottom:14px">Pill organizer</div><div style="display:flex;gap:10px">${"SMTWTFS".split("").map((d, i) => `<div style="flex:1;height:70px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font:600 22px Inter;background:${[1, 2, 4].includes(i) ? "#f7d9c9" : "#fff"}">${d}</div>`).join("")}</div></div>`),
      add(`<div class="abs bubble" style="left:1030px;top:700px;background:#e3f1e8;color:#21402f">Raj: dropped off groceries 👍</div>`),
      add(`<div class="abs card" style="left:1460px;top:760px;width:330px;transform:rotate(3deg)"><div class="kicker" style="font-size:16px;margin-bottom:10px">Ortho · Fri 10:30</div><div style="font:500 28px Inter">Driver: <span style="color:var(--ember)">???</span></div></div>`),
      add(`<div class="abs card" style="left:1590px;top:520px;width:250px;transform:rotate(-6deg);font:500 26px/1.3 Inter">Metformin running low?</div>`),
    ];
    tl.from(stat, { x: -60, opacity: 0, duration: 1 }, .2)
      .from(line, { y: 30, opacity: 0, duration: .9 }, .7)
      .from(line2, { y: 30, opacity: 0, duration: .9 }, 1.5);
    frags.forEach((f, i) => {
      tl.from(f, { scale: .6, opacity: 0, y: 60, duration: .7, ease: "back.out(1.6)" }, 2.2 + i * .55);
      tl.to(f, { y: "+=" + (i % 2 ? 14 : -14), rotation: "+=" + (i % 2 ? 1.5 : -1.5), duration: 2.2, yoyo: true, repeat: Math.ceil(D / 2.2), ease: "sine.inOut" }, 3 + i * .3);
    });
  },

  solution() {
    stage.className = "cream";
    const hub = add(`<div class="abs" style="left:810px;top:330px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#f08a52,#e46a2e 55%,#b84a18);box-shadow:0 0 120px 30px rgba(228,106,46,.35);display:grid;place-items:center;color:#fff;text-align:center;font:600 34px/1.2 Fraunces">Hearth<br><span style="font:500 20px/1.3 Inter;opacity:.9">one shared<br>household memory</span></div>`);
    const frags = ["Did Mom take her 8pm pill??", "who's driving Mom on Friday?", "Metformin running low?", "dropped off groceries", "Ortho · Fri 10:30"].map((t, i) => {
      const a = [[1100, 140], [1500, 220], [1590, 540], [1050, 720], [1460, 780]][i];
      return add(`<div class="abs card" style="left:${a[0]}px;top:${a[1]}px;font:500 24px Inter;padding:16px 22px">${t}</div>`);
    });
    const svg = add(`<svg class="abs" style="left:0;top:0" width="1920" height="1080"><path id="pa" d="M420 480 C 600 480, 700 480, 810 480" stroke="#e46a2e" stroke-width="4" fill="none" stroke-dasharray="10 12"/><path id="pb" d="M1110 480 C 1220 480, 1320 480, 1500 480" stroke="#e46a2e" stroke-width="4" fill="none" stroke-dasharray="10 12"/></svg>`);
    const left = add(`<div class="abs node card" style="left:120px;top:370px">🎙️ Asha<small>talks to the Echo in her kitchen</small></div>`);
    const right = add(`<div class="abs node card" style="left:1500px;top:370px">📱 Priya<small>three states away</small></div>`);
    const chips = add(`<div class="abs center" style="top:800px;color:var(--ink)"><span class="chip">MCP 2025-11-25</span><span class="chip">Streamable HTTP</span><span class="chip">self-hosted</span></div>`);
    tl.from(hub, { scale: 0, duration: 1, ease: "back.out(1.4)" }, .2);
    frags.forEach((f, i) => tl.to(f, { left: 860, top: 460, scale: .2, opacity: 0, duration: 1.1, ease: "power2.in" }, .6 + i * .18));
    tl.to(hub, { scale: 1.08, duration: .3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.9)
      .from(left, { x: -80, opacity: 0, duration: .8 }, 2.6)
      .from(right, { x: 80, opacity: 0, duration: .8 }, 2.9)
      .from(svg.querySelectorAll("path"), { opacity: 0, duration: .6 }, 3.2)
      .to(svg.querySelectorAll("path"), { strokeDashoffset: -220, duration: D, ease: "none" }, 3.2)
      .from(chips.children, { y: 30, opacity: 0, stagger: .2, duration: .7 }, 4.2);
  },

  intro() {
    stage.className = "dark";
    const k = add(`<div class="abs center kicker" style="top:380px">Live demo</div>`);
    const t = add(`<div class="abs center serif" style="top:430px;font-size:96px;font-weight:600">Simulated Alexa+ Echo Show</div>`);
    const s = add(`<div class="abs center" style="top:600px;font:400 32px/1.5 Inter;color:var(--smuted)">Every tool call, elicitation and card is live MCP traffic to Hearth.<br><span style="font-size:24px;color:#8b7d71">Scripted playback: spoken replies are pre-written instead of generated by a model.</span></div>`);
    const bar = add(`<div class="abs" style="left:760px;top:780px;width:400px;height:6px;border-radius:3px;background:linear-gradient(90deg,#3fd0ff,#e46a2e);transform-origin:left"></div>`);
    tl.from(k, { opacity: 0, y: 20, duration: .6 }, .1).from(t, { opacity: 0, y: 40, duration: .9 }, .3).from(s, { opacity: 0, duration: .9 }, .9).from(bar, { scaleX: 0, duration: D - 1, ease: "none" }, .8);
  },

  arch() {
    stage.className = "cream";
    const title = add(`<div class="abs center serif" style="top:70px;font-size:64px;font-weight:600">One household, every device</div>`);
    const clients = ["Echo Dot · Alexa+", "Alexa+ simulator", "MCP Inspector · Claude"].map((t, i) => add(`<div class="abs card" style="left:120px;top:${250 + i * 170}px;width:420px;font:600 30px Inter;text-align:center">${t}</div>`));
    const server = add(`<div class="abs" style="left:760px;top:300px;width:400px;height:400px;border-radius:30px;background:var(--screen);color:var(--sink);padding:40px;box-shadow:0 30px 80px rgba(36,29,24,.3)"><div class="kicker">MCP server</div><div class="serif" style="font-size:64px;font-weight:600;margin:14px 0 24px">Hearth</div><div class="mono" style="font-size:21px;line-height:1.8;color:var(--smuted)">sessions · Origin check<br>OAuth 2.1 · elicitation<br>MCP App digest</div></div>`);
    const outs = ["ntfy push → family phones", "Webhooks · Slack, Discord", "SQLite household store"].map((t, i) => add(`<div class="abs card" style="left:1380px;top:${250 + i * 170}px;width:420px;font:600 28px Inter;text-align:center">${t}</div>`));
    const paths = [];
    let d = "";
    for (let i = 0; i < 3; i++) {
      const y = 290 + i * 170;
      d += `<path d="M540 ${y} C 650 ${y}, 650 500, 760 500" /><path d="M1160 500 C 1270 500, 1270 ${y}, 1380 ${y}" />`;
    }
    const svg = add(`<svg class="abs" style="left:0;top:0" width="1920" height="1080"><g stroke="#d9c8b6" stroke-width="3" fill="none">${d}</g></svg>`);
    const label = add(`<div class="abs center mono" style="top:735px;font-size:22px;color:var(--muted)">Streamable HTTP · POST / GET / DELETE /mcp</div>`);
    const badges = add(`<div class="abs center" style="top:860px;color:var(--ember)"><span class="chip">OAuth 2.1 service tokens</span><span class="chip">account linking + PKCE</span><span class="chip">RFC 9728</span><span class="chip">&lt; 500 ms tools</span></div>`);
    tl.from(title, { y: -30, opacity: 0, duration: .8 }, 0)
      .from(clients, { x: -60, opacity: 0, stagger: .2, duration: .7 }, .4)
      .from(server, { scale: .8, opacity: 0, duration: .8, ease: "back.out(1.4)" }, .9)
      .from(outs, { x: 60, opacity: 0, stagger: .2, duration: .7 }, 1.4)
      .from(svg.querySelectorAll("path"), { opacity: 0, duration: .6, stagger: .05 }, 1.6)
      .from(label, { opacity: 0, duration: .6 }, 2.2)
      .from(badges.children, { y: 30, opacity: 0, stagger: .25, duration: .6 }, 4.5);
    // packets flowing along each path
    svg.querySelectorAll("path").forEach((p, i) => {
      const len = p.getTotalLength();
      for (let k = 0; k < 3; k++) {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("r", 8); c.setAttribute("fill", i % 2 ? "#e46a2e" : "#3fd0ff"); c.style.opacity = 0;
        svg.appendChild(c);
        const o = { t: 0 };
        const start = 2 + (i * .37 + k * 1.3) % 3;
        tl.to(o, { t: 1, duration: 1.4, ease: "power1.inOut", repeat: Math.ceil((D - start) / 3), repeatDelay: 1.6,
          onUpdate() { const pt = p.getPointAtLength(o.t * len); c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y); c.style.opacity = o.t > 0 && o.t < 1 ? 1 : 0; } }, start);
      }
    });
  },

  probe() {
    stage.className = "dark";
    const lines = `✔ SHOULD Rejects POST whose Accept omits text/event-stream
✔ MUST   Rejects a foreign Origin with 403 (DNS rebinding)
✔ MUST   initialize succeeds over POST
✔ SHOULD Negotiates protocol 2025-11-25
✔ MUST   Mcp-Session-Id uses only visible ASCII (0x21-0x7E)
✔ MUST   Accepted notification returns 202 with no body
✔ MUST   ping returns an empty result
✔ SHOULD Unknown method returns JSON-RPC -32601
✔ MUST   Unsupported MCP-Protocol-Version header returns 400
✔ MUST   Unknown Mcp-Session-Id returns 404
✔ MUST   Every tool has an inputSchema of type object
✔ MUST   GET returns an SSE stream or 405
✔ SHOULD DELETE terminates the session
✔ MUST   Requests on a terminated session return 404`.split("\n");
    const k = add(`<div class="abs kicker" style="left:120px;top:150px">Open source</div>`);
    const h = add(`<div class="abs serif" style="left:120px;top:195px;font-size:84px;font-weight:600;line-height:1.05">mcp-http-probe</div>`);
    const p = add(`<div class="abs" style="left:120px;top:330px;width:560px;font:400 30px/1.45 Inter;color:var(--smuted)">Black-box conformance checks for any Streamable HTTP MCP server. Each failure links to the spec rule.</div>`);
    const b1 = add(`<div class="abs card" style="left:120px;top:600px;width:560px;background:#1f1a16;border-color:#3a302a;color:var(--sink)"><div class="kicker" style="font-size:16px">npm</div><div class="mono" style="font-size:26px;margin-top:10px">npx mcp-http-probe &lt;url&gt;</div></div>`);
    const b2 = add(`<div class="abs card" style="left:120px;top:770px;width:560px;background:#1f1a16;border-color:#3a302a;color:var(--sink)"><div class="kicker" style="font-size:16px">GitHub Marketplace Action</div><div class="mono" style="font-size:24px;margin-top:10px">uses: Chinmay-92/mcp-http-probe@v1</div></div>`);
    const term = add(`<div class="abs term" style="left:780px;top:120px;width:1020px;height:840px"><div class="bar"><i></i><i></i><i></i></div><pre></pre></div>`);
    const pre = term.querySelector("pre");
    const cmd = "$ npx mcp-http-probe http://127.0.0.1:8787/mcp";
    const o = { n: 0, l: 0 };
    const render = () => {
      let s = cmd.slice(0, Math.round(o.n));
      if (o.n >= cmd.length) s += "\n\n";
      const shown = lines.slice(0, Math.floor(o.l));
      s += shown.map((x) => `<span class="ok">✔</span> <span class="lvl">${x.slice(2, 9)}</span>${x.slice(9)}`).join("\n");
      if (o.l >= lines.length) s += `\n<span style="color:#8b7d71">  … 23 checks</span>\n\n<span class="ok" style="font-weight:500">23 passed, 0 failed, 0 warnings</span>`;
      pre.innerHTML = s;
    };
    tl.from([k, h], { y: 30, opacity: 0, stagger: .15, duration: .7 }, 0)
      .from(p, { opacity: 0, duration: .8 }, .5)
      .from(term, { y: 40, opacity: 0, duration: .8 }, .3)
      .to(o, { n: cmd.length, duration: 1.6, ease: "none", onUpdate: render }, .9)
      .to(o, { l: lines.length + .99, duration: Math.min(5, D - 5), ease: "none", onUpdate: render }, 2.8)
      .from([b1, b2], { x: -40, opacity: 0, stagger: .3, duration: .7 }, Math.min(8, D - 3));
  },

  outro() {
    stage.className = "dark";
    const ring = add(`<div class="abs" style="left:860px;top:180px;width:200px;height:200px">${ringSVG(200, 14)}</div>`);
    const dot = add(`<div class="abs" style="left:942px;top:262px;width:36px;height:36px;border-radius:50%;background:var(--ember);box-shadow:0 0 50px 16px rgba(228,106,46,.6)"></div>`);
    const w = add(`<div class="abs center serif" style="top:420px;font-size:130px;font-weight:600">Hearth</div>`);
    const t = add(`<div class="abs center" style="top:600px;font:400 38px/1.4 Inter;color:var(--smuted)">One household, every device,<br>and nobody has to remember everything alone.</div>`);
    const u = add(`<div class="abs center mono" style="top:820px;font-size:30px;color:var(--ember)">github.com/Chinmay-92/hearth</div>`);
    const f = add(`<div class="abs center" style="top:900px;font:400 22px Inter;color:#8b7d71">Alexa+ track · Open Source mini-challenge · MIT licensed · not a medical device</div>`);
    tl.to(ring.querySelector(".arc"), { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 0)
      .from(dot, { scale: 0, duration: .7, ease: "back.out(2)" }, .2)
      .from(w, { y: 40, opacity: 0, duration: .9 }, .5)
      .from(t, { opacity: 0, duration: .9 }, 1.2)
      .from([u, f], { opacity: 0, y: 20, stagger: .3, duration: .8 }, 2.2);
  },
};

scenes[SCENE]();
// Fade the whole scene out in its last 0.4s so cuts feel soft.
tl.to(stage, { opacity: 0, duration: .4, ease: "none" }, D - .4);
window.seek = (t) => { tl.seek(Math.min(t, D), false); };
window.ready = document.fonts.ready.then(() => { tl.seek(0); return true; });
</script></body></html>
